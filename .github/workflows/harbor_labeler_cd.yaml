name: Harbor Labeler Publish

on:
    push:
        branches: ["main"]
        paths:
            - "canfar-replication/**"

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Harbor
              uses: docker/login-action@v3
              with:
                  registry: ${{ vars.HARBOR_REGISTRY  }}
                  username: ${{ secrets.HARBOR_USERNAME }}
                  password: ${{ secrets.HARBOR_PASSWORD }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: ./canfar-replication/python
                  file: ./canfar-replication/python/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ${{ vars.HARBOR_REGISTRY }}/harbor/harbor-labeler:${{ github.sha }}
                      ${{ vars.HARBOR_REGISTRY  }}/harbor/harbor-labeler:latest

---
- name: Ensure ansible-added group exists
  ansible.builtin.group:
    name: ansible-added
    state: present
    system: yes

- name: Ensure extra groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ additional_users | selectattr('groups', 'defined') | map(attribute='groups') | flatten | unique }}"
  when: additional_users is defined and additional_users | length > 0

# --- User Removal ---
- name: Get ansible-added group members
  ansible.builtin.command: getent group ansible-added
  register: _ansible_added_group
  when: additional_users is defined

- name: Show additional_users
  debug:
    var: additional_users

- name: Show type
  debug:
    msg: "{{ additional_users | type_debug }}"

- name: Show getent result
  debug:
    msg: "{{ _ansible_added_group.stdout }}"

- name: Set existing users fact
  ansible.builtin.set_fact:
    existing_users: >-
      {{
        (_ansible_added_group.stdout.split(':')[3] | default(''))
        .split(',')
        | reject('equalto', '')
        | list
      }}
  when: _ansible_added_group.rc == 0

- name: Set users with state absent fact
  ansible.builtin.set_fact:
    _state_absent_users: >-
      {{
        additional_users | default([])
        | selectattr('state', 'defined')
        | selectattr('state', 'equalto', 'absent')
        | map(attribute='name')
        | list
      }}
  when: additional_users is defined

- name: Set users to remove
  ansible.builtin.set_fact:
    _users_to_remove: >-
      {{
        (existing_users | default([])
        | difference(
            additional_users | default([]) | map(attribute='name') | list
          ))
        | union(_state_absent_users | default([]))
        | unique
      }}
  when: additional_users is defined

- name: Remove users no longer in additional_users
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: yes
  loop: "{{ _users_to_remove | default([]) }}"
  when:
    - additional_users is defined
    - _users_to_remove | default([]) | length > 0

- name: Remove sudoers files for removed users
  ansible.builtin.file:
    path: /etc/sudoers.d/{{ item }}
    state: absent
  loop: "{{ _users_to_remove | default([]) }}"
  when:
    - additional_users is defined
    - _users_to_remove | default([]) | length > 0

# --- Sync group memberships (remove users from groups they no longer belong to) ---
- name: Get current groups for additional users
  ansible.builtin.command: id -Gn {{ item.name }}
  register: _user_current_groups
  changed_when: false
  failed_when: false
  loop: "{{ additional_users | default([]) }}"
  when:
    - additional_users is defined
    - additional_users | length > 0

- name: Set groups to remove per user fact
  ansible.builtin.set_fact:
    _group_removals: >-
      {{
        (_group_removals | default([]))
        + [
          {
            'name': item.item.name,
            'groups': (
              (item.stdout | default('') | split)
              | difference((item.item.groups | default([]) + ['ansible-added']))
              | list
            )
          }
        ]
      }}
  loop: "{{ _user_current_groups.results | default([]) }}"
  when:
    - item.rc == 0
    - item.stdout | default('') | length > 0

- name: Remove users from groups they no longer belong to
  ansible.builtin.command: gpasswd -d {{ item.0.name }} {{ item.1 }}
  register: _gpasswd_result
  changed_when: _gpasswd_result.rc == 0
  failed_when: false
  loop: "{{ _group_removals | default([]) | subelements('groups') }}"
  when:
    - additional_users is defined
    - _group_removals | default([]) | length > 0

# --- User Creation ---
- name: Ensure additional users exist
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.name }}"
    shell: /bin/bash
    create_home: yes
    groups: "{{ (item.groups | default([]) + ['ansible-added']) | join(',') }}"
    append: yes
    state: "{{ item.state | default('present') }}"
  loop: "{{ additional_users }}"
  when:
    - additional_users is defined
    - additional_users is not none
    - additional_users | length > 0
    - item.state | default('present') == 'present'

- name: Set up SSH directory for additional users
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ additional_users }}"
  when:
    - additional_users is defined
    - additional_users is not none
    - additional_users | length > 0
    - item.state | default('present') == 'present'

- name: Add SSH authorized keys for additional users
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.static_ssh_key }}"
    exclusive: no
  loop: "{{ additional_users }}"
  when:
    - additional_users is defined
    - additional_users is not none
    - additional_users | length > 0
    - item.state | default('present') == 'present'
    - item.static_ssh_key | default('') | length > 0

- name: Configure sudo access for additional users
  ansible.builtin.copy:
    content: "{{ item.sudo }}\n"
    dest: /etc/sudoers.d/{{ item.name }}
    mode: "0440"
  loop: "{{ additional_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - additional_users is defined
    - additional_users is not none
    - additional_users | length > 0
    - item.state | default('present') == 'present'
    - "'sudo' in item"

- name: Remove sudoers files for users without sudo access
  ansible.builtin.file:
    path: /etc/sudoers.d/{{ item.name }}
    state: absent
  loop: "{{ additional_users | default([]) }}"
  when:
    - additional_users is defined
    - item.state | default('present') == 'present'
    - "'sudo' not in item"

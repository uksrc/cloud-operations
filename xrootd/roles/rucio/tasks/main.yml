# https://osg-htc.org/docs/common/ca/


- name: Add repo
  ansible.builtin.shell: yum install https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm -y
  # ansible.builtin.yum_repository:
  #   name: epel
  #   description: EPEL yum repo
  #   baseurl: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm"
  become: true

- name: Add OSG repo
  ansible.builtin.shell: yum install https://repo.osg-htc.org/osg/25-main/osg-25-main-el9-release-latest.rpm -y
  # ansible.builtin.yum_repository:
  #   name: osg
  #   description: osg yum repo
  #   baseurl: "https://repo.osg-htc.org/osg/25-main/osg-25-main-el9-release-latest.rpm"
  become: true

- name: install osg-ca-certs
  ansible.builtin.dnf:
    name: osg-ca-certs
    state: present
  become: true

- name: update crypto policies
  ansible.builtin.shell: update-crypto-policies --set DEFAULT:SHA1
  become: true

- name: Get osg .pem file
  ansible.builtin.get_url:
    url: https://osg-htc.org/security/cilogonosgca/cilogon-osg.pem
    dest: /etc/grid-security/certificates/cilogon-osg.pem
    mode: '0644'
  become: true

- name: install fetch-crl
  ansible.builtin.dnf:
    name: fetch-crl
    state: present
  become: true

- name: fetch crls
  ansible.builtin.shell: fetch-crl
  become: true
  ignore_errors: true


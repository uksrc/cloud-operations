---
- name: Install firewalld
  ansible.builtin.package:
    name: firewalld
    state: present

- name: Ensure firewalld is running and enabled
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: yes

# Configuration for the WCDC-DIRAC network (100Gbps)

- name: Create a new zone for the WCDC-DIRAC network
  firewalld:
    zone: "{{ wcdc_dirac_zone }}"
    state: present
    permanent: yes

- name: Reload firewalld to apply permanent changes
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true

- name: Set NM zone for eth1
  ansible.builtin.command: >
    nmcli connection modify "System {{ wcdc_dirac_interface }}" connection.zone "{{ wcdc_dirac_zone }}"
  changed_when: true

- name: Configure existing NetworkManager connection for WCDC-DIRAC
  ansible.builtin.command: >
    nmcli con mod "System eth1"
    ipv4.addresses {{ wcdc_dirac_ip }}/27
    ipv4.gateway {{ wcdc_dirac_gateway }}
    ipv4.method manual

- name: Set higher priority (lower metric) for System eth1
  ansible.builtin.command: >
    nmcli con mod "System eth1"
    ipv4.route-metric 50

- name: open port 1094 for XRootD in firewalld
  ansible.posix.firewalld:
    zone: "{{ wcdc_dirac_zone }}"
    port: 1094/tcp
    permanent: true
    state: enabled
    immediate: true

- name: open port 80 for LetsEncrypt in firewalld
  ansible.posix.firewalld:
    zone: "{{ wcdc_dirac_zone }}"
    port: 80/tcp
    permanent: true
    state: enabled
    immediate: true

# Configuration for the UKSRC network
- name: Set NM zone for eth0
  ansible.builtin.command: >
    nmcli connection modify "System {{ uksrc_interface }}" connection.zone trusted
  changed_when: true

- name: Lower priority for System eth0
  ansible.builtin.command: >
    nmcli con mod "System eth0"
    ipv4.route-metric 200

- name: Bring up System eth0
  ansible.builtin.command: nmcli con up "System eth0"

# Configuration for the IRIS network
- name: Set NM zone for eth2
  ansible.builtin.command: >
    nmcli connection modify "System {{ iris_interface }}" connection.zone public
  changed_when: true

# Configuration for the SSH network (local access)

# firewalld ssh config taken from https://docs.rackspace.com/docs/limit-ssh-access-by-ip-address

- name: add the ssh service to the trusted zone in firewalld
  ansible.posix.firewalld:
    zone: trusted
    service: ssh
    permanent: true
    state: enabled
    immediate: true

- name: add ssh source network to the trusted zone in firewalld
  ansible.posix.firewalld:
    zone: trusted
    source: "{{ ssh_local_access_cidr }}"
    permanent: true
    state: enabled
    immediate: true

- name: remove ssh service from the public zone in firewalld
  ansible.posix.firewalld:
    zone: public
    service: ssh
    permanent: true
    state: disabled
    immediate: true

- name: Restart firewalld service
  ansible.builtin.service:
    name: firewalld
    state: restarted

---
# Role: benchmark_xrootd
# Test suite that verifies the XRootD server is reached over a working
# 100Gb/s link and measures how much of that link is actually used.
#
# Server side (this role):
#   ansible-playbook xrootd.yml -i cambridge-inventory.yml \
#     --limit uksrc-cam-prod-xrootd --tags benchmark
# Client side (from any machine that can reach the 100Gb IP):
#   files/run-benchmark-client.sh -s 192.84.5.20
# See xrootd/README.md -> "Benchmarking the 100 Gb link".

# The WCDC-DIRAC 100Gb interface on the xrootd server
benchmark_iface: "eth1"

# Expected negotiated speed reported by ethtool for a 100GbE link (Mb/s)
benchmark_expected_link_speed_mbps: 100000

# IP of the 100Gb interface; used as the iperf3 server bind address
benchmark_server_ip: "192.84.5.20"

# Port used by the iperf3 benchmark server
benchmark_iperf3_port: 5201

# Port XRootD serves on (XrdHttp) over the 100Gb link
benchmark_xrootd_port: 1094

# Firewalld zone bound to the 100Gb interface
benchmark_zone: "wcdc-dirac"

# Leave the iperf3 benchmark server running after the playbook finishes
benchmark_iperf3_enable: true

# Optional: temporarily open the xrootd and iperf3 ports to these client IPs
# in the 100Gb zone so an off-subnet developer machine can benchmark.
# Disabled by default - never weaken production firewall rules unless asked.
benchmark_allow_client_ips: []
# example:
# benchmark_allow_client_ips:
#   - 86.21.218.207/32

# Optional: create benchmark data files under the exported data path so a
# client has something to download over XRootD. Disabled by default.
benchmark_prepare_data: false

# Where the benchmark files live (relative to data_path) and their shape
benchmark_data_dir: benchmark
benchmark_file_count: 4
benchmark_file_size_gb: 20
benchmark_file_prefix: "bench-"

# How to fill the files: "sparse" (instant zeros) or "zero" (dense, exercises
# the storage backend like real data)
benchmark_data_fill: sparse
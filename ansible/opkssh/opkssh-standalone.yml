# Standalone playbook to install and configure opkssh (OpenPubkey SSH).
# Equivalent to the opkssh role, with no dependency on appliance variables.
#
# Usage:
#   ansible-playbook -i host1, ansible/opkssh/opkssh-standalone.yml -e target=all \
#     -e '{"opkssh_auth_id": [{"name": "jane", "opkssh_claim_selector": "jane@example.com"}]}'
#
# Supports Ubuntu and Rocky Linux. On SELinux-enabled systems (Rocky) the
# upstream opkssh SELinux policy module is compiled and installed.
- name: Install and configure opkssh
  hosts: "{{ target | default('opkssh') }}"
  become: true
  vars_files:
    - opkssh-standalone-vars.yml

  pre_tasks:
    # Optional per-deployment user list - copy users.yml.example to users.yml
    - name: Load users.yml if present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/users.yml"
      when: lookup('ansible.builtin.fileglob', playbook_dir ~ '/users.yml') | length > 0

  tasks:
    # --- Validation ---
    - name: Check provider configuration
      ansible.builtin.assert:
        that: (item.value.keys() | list | sort) == (_opkssh_provider_keys | sort)
        fail_msg: "Entry '{{ item.key }}' in opkssh_providers must have keys {{ _opkssh_provider_keys }}"
      loop: "{{ opkssh_providers | dict2items }}"

    - name: Check authorized identities configuration
      ansible.builtin.assert:
        that: item.keys() | intersect(_opkssh_auth_id_keys) | sort == _opkssh_auth_id_keys | sort
        fail_msg: "Entries in opkssh_auth_id must have keys {{ _opkssh_auth_id_keys }}. Invalid item {{ item }}."
      loop: "{{ opkssh_auth_id }}"

    # --- Install ---
    - name: Ensure group used by AuthorizedKeysCommand exists
      ansible.builtin.group:
        name: "{{ opkssh_install_auth_cmd_group }}"
        system: true

    - name: Ensure user used by AuthorizedKeysCommand exists
      ansible.builtin.user:
        name: "{{ opkssh_install_auth_cmd_user }}"
        comment: Used for AuthorizedKeysCommand (opkssh)
        group: "{{ opkssh_install_auth_cmd_group }}"
        shell: "{{ opkssh_nologin_shell }}"
        system: true
        create_home: false

    - name: Install opkssh binary
      ansible.builtin.get_url:
        url: "{{ opkssh_install_binary_url }}"
        dest: "{{ opkssh_install_dir }}/{{ opkssh_install_binary_name }}"
        owner: root
        group: "{{ opkssh_install_auth_cmd_group }}"
        mode: '0755'

    # --- SELinux (Rocky etc.); mirrors scripts/install-linux.sh upstream ---
    - name: Configure SELinux for opkssh
      when: ansible_facts.selinux.status | default('disabled') != 'disabled'
      block:
        - name: Install SELinux tooling
          ansible.builtin.package:
            name: [checkpolicy, policycoreutils, policycoreutils-python-utils]
            state: present

        - name: Restore default context on opkssh binary
          ansible.builtin.command: "restorecon {{ opkssh_install_dir }}/{{ opkssh_install_binary_name }}"
          changed_when: false

        - name: Download opkssh SELinux type enforcement file
          ansible.builtin.get_url:
            url: "{{ opkssh_selinux_te_url }}"
            dest: /tmp/opkssh.te
            mode: '0600'

        - name: Create sshd_session_t variant of the policy
          # Newer policies run AuthorizedKeysCommand in sshd_session_t, not
          # sshd_t - try that first, fall back to sshd_t if the type is unknown
          ansible.builtin.command: "sed 's/sshd_t/sshd_session_t/g' /tmp/opkssh.te"
          register: _opkssh_te_session
          changed_when: false

        - name: Write sshd_session_t policy variant
          ansible.builtin.copy:
            dest: /tmp/opkssh-session.te
            content: "{{ _opkssh_te_session.stdout }}\n"
            mode: '0600'

        - name: Compile and install SELinux module (sshd_session_t)
          ansible.builtin.shell: >-
            checkmodule -M -m -o /tmp/opkssh.mod /tmp/opkssh-session.te &&
            semodule_package -o /tmp/opkssh.pp -m /tmp/opkssh.mod &&
            semodule -i /tmp/opkssh.pp
          register: _opkssh_semodule_session
          failed_when: false
          changed_when: true

        - name: Compile and install SELinux module (sshd_t fallback)
          ansible.builtin.shell: >-
            checkmodule -M -m -o /tmp/opkssh.mod /tmp/opkssh.te &&
            semodule_package -o /tmp/opkssh.pp -m /tmp/opkssh.mod &&
            semodule -i /tmp/opkssh.pp
          when: _opkssh_semodule_session.rc != 0
          changed_when: true

        - name: Set SELinux booleans for opkssh
          ansible.builtin.command: "setsebool -P {{ item }} on"
          loop: "{{ _opkssh_bools }}"
          when: _opkssh_bools | length > 0
          changed_when: true
          vars:
            _opkssh_bools: >-
              {{ (opkssh_selinux_enable_home_policy | bool) | ternary(['opkssh_enable_home'], [])
               + (opkssh_selinux_enable_proxy | bool) | ternary(['opkssh_enable_proxy'], [])
               + (opkssh_selinux_enable_squid | bool) | ternary(['opkssh_enable_squid'], []) }}

      always:
        - name: Remove temporary SELinux files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: [/tmp/opkssh.te, /tmp/opkssh-session.te, /tmp/opkssh.mod, /tmp/opkssh.pp]
          when: ansible_facts.selinux.status | default('disabled') != 'disabled'

    # --- Configure ---
    - name: Find sshd config with AuthorizedKeysCommand
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d/
        patterns: ['*.conf']
        contains: AuthorizedKeysCommand
        read_whole_file: true
      register: _opkssh_authorized_keys_configs

    - name: Check AuthorizedKeys options not set for other applications
      ansible.builtin.assert:
        that: _unexpected | length == 0
        fail_msg: "Found AuthorizedKeys* keyword(s) in unexpected file(s): {{ _unexpected }}"
      vars:
        _unexpected: "{{ _opkssh_authorized_keys_configs.files | map(attribute='path') | difference(['/etc/ssh/sshd_config.d/60-opk-ssh.conf']) }}"

    - name: Ensure configuration directories exist
      ansible.builtin.file:
        state: directory
        path: /etc/opk/policy.d
        owner: root
        group: "{{ opkssh_install_auth_cmd_group }}"
        mode: '0750'

    - name: Configure OpenSSH server to use opkssh
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/60-opk-ssh.conf
        owner: root
        group: root
        mode: '0600'
        content: |
          {% if opkssh_disable_authorized_keys | bool %}
          AuthorizedKeysFile none
          {% endif %}
          Match Address *
              AuthorizedKeysCommand {{ opkssh_install_dir }}/{{ opkssh_install_binary_name }} verify %u %k %t
              AuthorizedKeysCommandUser {{ opkssh_install_auth_cmd_user }}

          {% for group in opkssh_enable_authorized_keys_groups %}
          Match Group {{ group }}
              AuthorizedKeysFile .ssh/authorized_keys
          {% endfor %}
      notify: Restart OpenSSH server

    - name: Configure allowed OpenID Providers
      ansible.builtin.copy:
        dest: /etc/opk/providers
        owner: root
        group: "{{ opkssh_install_auth_cmd_group }}"
        mode: '0640'
        content: |
          # {{ ansible_managed }}
          {% for item in opkssh_providers.values() %}
          {{ item.issuer_uri }} {{ item.client_id }} {{ item.expires }}
          {% endfor %}

    - name: Configure authorized identities
      ansible.builtin.copy:
        dest: /etc/opk/auth_id
        owner: root
        group: "{{ opkssh_install_auth_cmd_group }}"
        mode: '0640'
        content: |
          # {{ ansible_managed }}
          {% for item in opkssh_auth_id %}
          {{ item.name }} {{ item.opkssh_claim_selector }} {{ opkssh_providers[item.opkssh_provider | default(opkssh_default_provider)].issuer_uri }}
          {% endfor %}

  handlers:
    - name: Restart OpenSSH server
      ansible.builtin.systemd:
        name: "{{ opkssh_sshd_service }}"
        state: restarted

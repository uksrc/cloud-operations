---
# CAOM Database Schema Configuration
# This file contains schema-specific variables for the CAOM metadata database

database_name: "caomdb"

# Database users and passwords
# IMPORTANT: In production, use vault or secure secret management
db_users:
  cadmin:
    password: "{{ lookup('env', 'CADMIN_PASSWORD') | default('changeme-cadmin', true) }}"
    role: "content admin"
  tapadm:
    password: "{{ lookup('env', 'TAPADM_PASSWORD') | default('changeme-tapadm', true) }}"
    role: "TAP admin"
  tapuser:
    password: "{{ lookup('env', 'TAPUSER_PASSWORD') | default('changeme-tapuser', true) }}"
    role: "TAP user"

# Required PostgreSQL extensions for this database
postgres_extensions:
  - citext
  - pg_sphere

# Required schemas and their owners
postgres_schemas:
  - name: caom2
    owner: cadmin
  - name: uws
    owner: tapadm
  - name: tap_schema
    owner: tapadm
  - name: tap_upload
    owner: tapuser

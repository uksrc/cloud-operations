---
- name: Install PostgreSQL and dependencies
  apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-{{ postgres_version }}-pgsphere"
      - python3-psycopg2
    state: present
    update_cache: yes

- name: Ensure PostgreSQL service is running and enabled
  systemd:
    name: postgresql
    state: started
    enabled: yes

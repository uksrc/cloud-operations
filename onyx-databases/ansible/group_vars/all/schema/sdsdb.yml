---
# Software Delivery Service Database Schema Configuration
# This file contains schema-specific variables for the SDS database

database_name: "sdsdb"

# Database users and passwords
# IMPORTANT: In production, use vault or secure secret management
db_users:
  sds_admin:
    password: "{{ lookup('env', 'SDS_ADMIN_PASSWORD') | default('changeme-sds-admin', true) }}"
    role: "SDS admin"
  sds_tap_admin:
    password: "{{ lookup('env', 'SDS_TAP_ADMIN_PASSWORD') | default('changeme-sds-admin', true) }}"
    role: "SDS TAP admin"
  sds_tap_user:
    password: "{{ lookup('env', 'SDS_TAP_USER_PASSWORD') | default('changeme-sds-user', true) }}"
    role: "SDS TAP user"

# Required PostgreSQL extensions for this database
postgres_extensions:
  - citext
  - pg_sphere

# Required schemas and their owners
postgres_schemas:
  - name: sds
    owner: sds_admin
  - name: uws
    owner: sds_tap_admin
  - name: tap_schema
    owner: sds_tap_admin
  - name: tap_upload
    owner: sds_tap_user

---
# Setup SDS database schema
# Deploys ALL environments by default.
# Deploy a single environment with:
#   ansible-playbook -i inventory setup_sds_db_schema.yml -e env=preprod
#
- name: Setup SDS database schema
  hosts: all
  become: yes
  vars:
    # Restricts which environment(s) to deploy.
    # Empty => every environment in sds_envs. Override with -e env=<name>.
    deploy_env: "{{ env | default('') }}"
  vars_files:
    - group_vars/all/schema/sdsdb.yml
    - group_vars/all/postgres.yml

  tasks:
    - name: Fail fast if requested environment is not valid
      fail:
        msg: "Environment '{{ deploy_env }}' is not valid. Valid options: {{ sds_envs | join(', ') }}"
      when:
        - deploy_env | length > 0
        - deploy_env not in sds_envs

    - name: Setup database schema for selected environment(s)
      include_role:
        name: setup_db_schema
      loop: "{{ sds_envs if not deploy_env else [deploy_env] }}"
      loop_control:
        loop_var: sds_env
